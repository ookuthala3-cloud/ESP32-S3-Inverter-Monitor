[platformio]
default_envs = esp32-s3-inverter

[env:esp32-s3-inverter]

; ==========================================
; Same ESP32 Arduino platform used by Bruce
; ==========================================
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip

framework = arduino
board = esp32-s3-devkitc-1

monitor_speed = 115200

; ==========================================
; ESP32-S3 N16R8
; ==========================================
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=1

    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OCT=1

    ; ======================================
    ; ST7789 240x240
    ; ======================================
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER

    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240

    ; Our LCD needs BGR order
    -DTFT_RGB_ORDER=TFT_BGR

    -DSMOOTH_FONT=1

    ; ======================================
    ; Bruce working display pins
    ; ======================================
    -DTFT_CS=16
    -DTFT_DC=7
    -DTFT_RST=15

    -DTFT_MOSI=6
    -DTFT_SCLK=5
    -DTFT_MISO=41

    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH

    ; ======================================
    ; SPI
    ; ======================================

    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000

    ; ======================================
    ; Fonts
    ; ======================================
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF

lib_deps =
    bodmer/TFT_eSPI
