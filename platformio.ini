[platformio]
default_envs = esp32-s3-inverter

[env:esp32-s3-inverter]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; =========================
; ESP32-S3 N16R8
; =========================
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=1

    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OCT=1

    ; =========================
    ; ST7789 240x240
    ; =========================
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER

    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240

    -DTFT_RGB_ORDER=TFT_BGR
    -DSMOOTH_FONT=1

    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DTFT_MOSI=11
    -DTFT_SCLK=12

    ; No MISO on this LCD
    -DTFT_MISO=-1

    -DTFT_BL=7
    -DTFT_BACKLIGHT_ON=HIGH

    -DTFT_SPI_PORT=FSPI

    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000

    ; Fonts
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF

lib_deps =
    bodmer/TFT_eSPI
