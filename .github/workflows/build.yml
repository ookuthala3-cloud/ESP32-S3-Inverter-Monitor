name: Build Inverter Monitor

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # Python
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # PlatformIO + esptool
      # ==========================================
      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      # ==========================================
      # Build
      # ==========================================
      - name: Build firmware
        run: |
          pio run -e esp32-s3-inverter

      # ==========================================
      # Prepare firmware files
      # ==========================================
      - name: Prepare firmware files
        run: |
          mkdir -p firmware

          cp .pio/build/esp32-s3-inverter/firmware.bin \
             firmware/Inverter-Monitor.bin

          cp .pio/build/esp32-s3-inverter/firmware.elf \
             firmware/firmware.elf

          cp .pio/build/esp32-s3-inverter/bootloader.bin \
             firmware/bootloader.bin

          cp .pio/build/esp32-s3-inverter/partitions.bin \
             firmware/partitions.bin

          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
             firmware/boot_app0.bin

      # ==========================================
      # Create single FULL firmware
      # ==========================================
      - name: Create merged firmware
        run: |
          python -m esptool --chip esp32s3 merge_bin \
            -o firmware/Inverter-Monitor-FULL.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0000 .pio/build/esp32-s3-inverter/bootloader.bin \
            0x8000 .pio/build/esp32-s3-inverter/partitions.bin \
            0xE000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/esp32-s3-inverter/firmware.bin

      # ==========================================
      # Show generated files
      # ==========================================
      - name: Show firmware files
        run: |
          echo "Generated firmware files:"
          ls -lh firmware/

      # ==========================================
      # Upload Artifact
      # ==========================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-Inverter-Monitor
          path: firmware/
          if-no-files-found: error
