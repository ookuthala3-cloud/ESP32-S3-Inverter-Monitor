name: Build Inverter Monitor

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e esp32-s3-inverter

      - name: Prepare firmware files
        run: |
          mkdir -p firmware
          cp .pio/build/esp32-s3-inverter/firmware.bin firmware/Inverter-Monitor.bin
          cp .pio/build/esp32-s3-inverter/bootloader.bin firmware/bootloader.bin
          cp .pio/build/esp32-s3-inverter/partitions.bin firmware/partitions.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-Inverter-Monitor
          path: firmware/
